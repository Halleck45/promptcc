version: 2

project_name: promptcc

# tree-sitter grammars are C code, so builds use cgo. Release builds run in
# the goreleaser-cross image (see .github/workflows/release.yml), which ships
# the cross toolchains referenced below. Linux and Windows binaries are fully
# static (no libc dependency); macOS links against the always-present system
# libraries.
builds:
  - main: ./cmd/promptcc
    binary: promptcc
    env:
      - CGO_ENABLED=1
    goos: [linux, darwin, windows]
    goarch: [amd64, arm64]
    ignore:
      - goos: windows
        goarch: arm64
    flags: [-trimpath]
    ldflags:
      - -s -w -X main.version={{.Version}}
    overrides:
      - goos: linux
        goarch: amd64
        env: [CC=x86_64-linux-gnu-gcc]
        ldflags:
          - -s -w -X main.version={{.Version}} -linkmode external -extldflags "-static"
      - goos: linux
        goarch: arm64
        env: [CC=aarch64-linux-gnu-gcc]
        ldflags:
          - -s -w -X main.version={{.Version}} -linkmode external -extldflags "-static"
      - goos: darwin
        goarch: amd64
        env: [CC=o64-clang]
      - goos: darwin
        goarch: arm64
        env: [CC=oa64-clang]
      - goos: windows
        goarch: amd64
        env: [CC=x86_64-w64-mingw32-gcc]
        ldflags:
          - -s -w -X main.version={{.Version}} -linkmode external -extldflags "-static"

archives:
  - formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
    files: [LICENSE, README.md]

checksum:
  name_template: checksums.txt

changelog:
  sort: asc
  filters:
    exclude: ["^docs:", "^test:", "^ci:"]

release:
  draft: false
