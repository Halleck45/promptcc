name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  goreleaser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # tree-sitter needs cgo, so cross-compilation runs in the
      # goreleaser-cross image, which bundles toolchains for every target.
      - name: Release
        run: |
          docker run --rm \
            -v "$PWD:/src" -w /src \
            -e GITHUB_TOKEN \
            ghcr.io/goreleaser/goreleaser-cross:v1.24 \
            release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
